# Сборка аддона и установщика на Windows-сервере GitHub — на Mac их не собрать (net48 + WPF + Inno Setup).
#
# - push в master: тесты ядра + установщик. Скачать: Actions → запуск → Artifacts (хранится 30 дней).
# - тег vX.Y.Z: то же + выпуск с установщиком в публичном little-7o7/strassio-releases (код там не лежит).
#   Тег с дефисом (v1.0.0-beta.1) — пробный выпуск (pre-release).
#   Заголовок и текст выпуска — из docs/releases/vX.Y.Z.md (первая строка «# …» — заголовок).
# - вручную: Actions → «Сборка установщика» → Run workflow. С галочкой «Выпустить» (только на master) — то же,
#   что тег: тег vX.Y.Z по версии из проекта ставится сам. Так выпуск делается и без git на компьютере
#   (облачные сессии Claude не могут отправлять теги).

name: Сборка установщика

on:
  push:
    branches: [master]
    tags: ['v*']
    # Только сервер или документы — собирать нечего (к тегам эти фильтры не применяются).
    paths-ignore: ['server/**', 'docs/**', '**/*.md', '.claude/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Выпустить: тег vX.Y.Z по версии из проекта и выпуск в strassio-releases (только с master)'
        type: boolean
        default: false

permissions:
  contents: write # создать выпуск по тегу (запасной путь — в этом же репозитории)

env:
  # Код закрыт, поэтому установщики выкладываются в отдельный публичный репозиторий: там только .exe
  # и описание. Доступ на запись только к нему — секрет RELEASES_TOKEN. Нет секрета — выпуск, как раньше, здесь.
  RELEASES_REPO: little-7o7/strassio-releases

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Концы строк как у автора (core.autocrlf=false): файлы языков встраиваются в DLL байт в байт.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # Interop CorelDRAW — файл Corel, в публичный репозиторий его класть нельзя. Берётся из закрытого
      # little-7o7/strassio-interop по ключу только для чтения (секрет INTEROP_DEPLOY_KEY).
      - uses: actions/checkout@v7
        with:
          repository: little-7o7/strassio-interop
          ssh-key: ${{ secrets.INTEROP_DEPLOY_KEY }}
          persist-credentials: false
          path: _interop
      - name: Interop CorelDRAW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/Strassio.Corel/interop | Out-Null
          Copy-Item _interop/Corel.Interop.VGCore.dll src/Strassio.Corel/interop/
          Remove-Item _interop -Recurse -Force

      # .NET 10 SDK, как на компьютере автора (на сервере могут стоять и другие — закрепляем 10).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: .NET 10 SDK
        shell: pwsh
        run: |
          $sdk = dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } | Where-Object { $_ -like '10.0.*' } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $sdk) { throw 'Нет .NET 10 SDK' }
          Set-Content global.json "{ `"sdk`": { `"version`": `"$sdk`", `"rollForward`": `"disable`" } }"
          dotnet --version

      # Версия в двух местах должна совпадать, а у тега — быть той же.
      - name: Версия
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
          RELEASE: ${{ inputs.release }}
        run: |
          $csproj = (Select-Xml -Path src/Strassio.Corel/Strassio.Corel.csproj -XPath '//Version').Node.InnerText.Trim()
          $iss = [regex]::Match((Get-Content installer/Strassio.iss -Raw), '#define AppVersion "([^"]+)"').Groups[1].Value
          if ($csproj -ne $iss) { throw "Версии не совпадают: Strassio.Corel.csproj $csproj, Strassio.iss $iss" }
          if ($env:REF_TYPE -eq 'tag' -and $env:TAG -ne "v$iss") { throw "Тег $env:TAG, а версия в проекте $iss" }
          if ($env:RELEASE -eq 'true' -and $env:REF -ne 'refs/heads/master') { throw "Выпуск вручную — только с master, а не с $env:REF" }
          "version=$iss" >> $env:GITHUB_OUTPUT
          if ($env:REF_TYPE -eq 'tag') {
            "release=true`ntag=$env:TAG" >> $env:GITHUB_OUTPUT
          } elseif ($env:RELEASE -eq 'true') {
            "release=true`ntag=v$iss`nnew_tag=true" >> $env:GITHUB_OUTPUT
          }

      - name: Тесты ядра
        run: dotnet test tests/Strassio.Core.Tests -c Release --nologo

      # Тот же скрипт, что у автора: сборка Release → Obfuscar → Inno Setup (стоит на сервере GitHub).
      - name: Установщик
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: SHA-256
        id: hash
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OWN_REPO: ${{ github.repository }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "installer/out/Strassio-Setup-$version.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # Та же программа под постоянным именем — для ссылки «Скачать» на сайте:
          # https://github.com/little-7o7/strassio-releases/releases/latest/download/Strassio-Setup.exe
          Copy-Item $exe installer/out/Strassio-Setup.exe
          $repo = if ($env:RELEASES_TOKEN) { $env:RELEASES_REPO } else { $env:OWN_REPO }
          $url = "https://github.com/$repo/releases/download/v$version/Strassio-Setup-$version.exe"
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "### Strassio-Setup-$version.exe`n`nДля админки (раздел «Обновление»), после выпуска по тегу v${version}:`n`n- ссылка: ``$url```n- SHA-256: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: Strassio-Setup-${{ steps.version.outputs.version }}
          path: ${{ steps.hash.outputs.exe }}
          retention-days: 30

      - name: Выпуск на GitHub
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          OWN_TOKEN: ${{ github.token }}
          OWN_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          EXE: ${{ steps.hash.outputs.exe }}
        run: |
          # Выпуск вручную: тег ставится здесь (тег от GITHUB_TOKEN не запускает сборку второй раз).
          # Такой тег уже есть — ошибка: версию не выпускают дважды, поднимите номер.
          if ($env:NEW_TAG -eq 'true') {
            git tag $env:TAG
            git push origin "refs/tags/$($env:TAG)"
            if ($LASTEXITCODE -ne 0) { throw "Не удалось поставить тег $env:TAG (уже есть?)" }
          }

          if ($env:RELEASES_TOKEN) {
            $env:GH_TOKEN = $env:RELEASES_TOKEN; $repo = $env:RELEASES_REPO; $verify = @()
          } else {
            Write-Host "::warning::Нет секрета RELEASES_TOKEN — выпуск в этом репозитории. Если он закрыт, покупатели скачать не смогут."
            $env:GH_TOKEN = $env:OWN_TOKEN; $repo = $env:OWN_REPO; $verify = @('--verify-tag')
          }

          $notesFile = "docs/releases/$env:TAG.md"
          if (Test-Path $notesFile) {
            $lines = @(Get-Content $notesFile -Encoding utf8)
            $title = $lines[0] -replace '^#\s*', ''
            $body = ($lines | Select-Object -Skip 1) -join "`n"
          } else {
            $title = "Strassio $env:VERSION"
            $body = "Закройте CorelDRAW и запустите Strassio-Setup-$env:VERSION.exe."
          }
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notes $body.Trim() -Encoding utf8

          # Пробный выпуск (pre-release) — только версии с дефисом, например v1.0.0-beta.1. Остальные —
          # обычные: последний из них открывается ссылкой …/releases/latest (кнопка «Скачать» на сайте).
          $pre = if ($env:TAG -match '-') { @('--prerelease') } else { @() }
          gh release view $env:TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:EXE installer/out/Strassio-Setup.exe --repo $repo --clobber
          } else {
            gh release create $env:TAG $env:EXE installer/out/Strassio-Setup.exe --repo $repo @pre @verify --title $title --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось создать выпуск' }
          "Выпуск: https://github.com/$repo/releases/tag/$env:TAG" >> $env:GITHUB_STEP_SUMMARY
